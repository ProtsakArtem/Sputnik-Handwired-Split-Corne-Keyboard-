CONFIG_ZMK_SPLIT=y
# Right half is peripheral by default (do NOT set CENTRAL)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# Wired split over UART
CONFIG_ZMK_SPLIT_WIRED=y

# wired only
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n

# Serial/UART
CONFIG_SERIAL=y
CONFIG_UART_NRFX=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE=n
