CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_SPLIT_ROLE_PERIPHERAL=y

# Wired split over UART
CONFIG_ZMK_SPLIT_WIRED=y

# We want wired only
CONFIG_BT=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n

# Serial/UART
CONFIG_SERIAL=y
CONFIG_UART_NRFX=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_CONSOLE=n
